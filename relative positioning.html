<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      border: 10px solid blue;
      padding: 0px;
    }

    img {
      width: 300px;
      margin: 30px;
    }

    .move {
      position: relative; /* enable movement */
      top: 30px;          /* visible move DOWN */
      left: 30px;         /* visible move RIGHT */
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Image_created_with_a_mobile_phone.png/250px-Image_created_with_a_mobile_phone.png" class="move" alt="Moved image">
    <img src="https://media.istockphoto.com/id/814423752/photo/eye-of-model-with-colorful-art-make-up-close-up.jpg?s=612x612&w=0&k=20&c=l15OdMWjgCKycMMShP8UK94ELVlEGvt7GmB_esHWPYE=" alt="Normal image">
  </div>

</body>
</html>
