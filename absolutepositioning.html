<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Absolute Positioning with Images</title>
<style>
  .container {
    position: relative;   /* positioning context */
    width: 500px;
    height: 300px;
    border: 100px solid #B8548C;
    margin: 40px auto;
  }

  .background-image {
    width: 100%;
    height: 100%;
    display: block;
  }

  .overlay-image {
    position: absolute;   /* absolute positioning */
    top: 20px;            /* 20px from top of container */
    left: 20px;           /* 20px from left of container */
    width: 100px;
    height: 100px;  
    border: 3px solid white;
  }

  .label {
    position: absolute;
    bottom: 10px;         /* 10px from bottom */
    right: 10px;          /* 10px from right */
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 6px 12px;
    font-family: sans-serif;
    border-radius: 5px;
  }
</style>
</head>
<body style="background-color: #0B3478">


<div class="container">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-yQ6tcOe631WgPz9r6QQb36fbUwtIZ9gUvg&s" alt="Background" class="background-image" />
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiY-4wHKIOcSJqUWeZtpXG4tN7VKLIkWcBHQ&s" alt="Overlay" class="overlay-image" />
  <div class="label">Overlay Label</div>
</div>

</body>
</html>
